<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="fw-bold text-center mb-2">
                        {{ id ? '✏️ Update Expense' : '💳 Add New Expense' }}
                    </h2>

                    <p class="text-center text-muted mb-4">
                        {{ id
                        ? 'Update your expense information'
                        : 'Keep track of your daily expenses'
                        }}
                    </p>

                    <form #expenseForm="ngForm" (ngSubmit)="saveExpense()">

                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                📝 Title
                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg"
                                placeholder="Enter expense title"
                                name="title"
                                [(ngModel)]="title"
                                #titleField="ngModel"
                                required>

                            <div
                                class="text-danger mt-1"
                                *ngIf="titleField.invalid && titleField.touched">

                                Title is required.

                            </div>

                        </div>

                        <!-- Amount -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                💰 Amount
                            </label>

                            <input
                                type="number"
                                class="form-control form-control-lg"
                                placeholder="0"
                                name="amount"
                                [(ngModel)]="amount"
                                #amountField="ngModel"
                                required
                                min="1">

                            <div
                                class="text-danger mt-1"
                                *ngIf="amountField.invalid && amountField.touched">

                                Amount must be greater than 0.

                            </div>

                        </div>

                        <!-- Category -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                📂 Category
                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg"
                                placeholder="Food, Transport..."
                                name="category"
                                [(ngModel)]="category"
                                #categoryField="ngModel"
                                required>

                            <div
                                class="text-danger mt-1"
                                *ngIf="categoryField.invalid && categoryField.touched">

                                Category is required.

                            </div>

                        </div>

                        <!-- Date -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                📅 Date
                            </label>

                            <input
                                type="date"
                                class="form-control form-control-lg"
                                name="date"
                                [(ngModel)]="date"
                                #dateField="ngModel"
                                required>

                            <div
                                class="text-danger mt-1"
                                *ngIf="dateField.invalid && dateField.touched">

                                Date is required.

                            </div>

                        </div>

                        <div class="d-flex justify-content-between">

                            <button
                                type="button"
                                class="btn btn-outline-secondary px-4"
                                routerLink="/expenses">

                                Cancel

                            </button>

                            <button
                                type="submit"
                                class="btn btn-success px-5"
                                [disabled]="expenseForm.invalid">

                                <i class="bi bi-check-circle me-2"></i>

                                {{ id ? 'Update Expense' : 'Save Expense' }}

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
