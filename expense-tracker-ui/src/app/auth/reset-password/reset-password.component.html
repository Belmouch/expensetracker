<main class="auth-reset-page">
  <section class="auth-reset-card">
    <div class="auth-reset-brand"><i class="bi bi-key"></i></div>
    <h1>Set a new password</h1>
    <p>Choose a strong password with at least 8 characters.</p>

    <form class="auth-reset-form" (ngSubmit)="submit()">
      <div>
        <label for="new-password">New password</label>
        <div class="auth-reset-password-field">
          <input
            id="new-password"
            class="auth-reset-input"
            [type]="showNewPassword ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            required
          >
          <button type="button" class="auth-reset-password-toggle" (click)="showNewPassword = !showNewPassword" aria-label="Show or hide new password">
            <i [class]="showNewPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <div>
        <label for="confirm-password">Confirm new password</label>
        <div class="auth-reset-password-field">
          <input
            id="confirm-password"
            class="auth-reset-input"
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            autocomplete="new-password"
            required
          >
          <button type="button" class="auth-reset-password-toggle" (click)="showConfirmPassword = !showConfirmPassword" aria-label="Show or hide password confirmation">
            <i [class]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <button class="auth-reset-button" type="submit" [disabled]="loading" [attr.aria-busy]="loading">
        <i class="bi" [class.bi-hourglass-split]="loading" [class.bi-check2-circle]="!loading"></i>
        {{ loading ? 'Resetting...' : 'Reset password' }}
      </button>
    </form>

    <a class="auth-reset-link" routerLink="/login">Back to Login</a>
  </section>
</main>
