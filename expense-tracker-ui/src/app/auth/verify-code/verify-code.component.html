<main class="auth-reset-page">
  <section class="auth-reset-card">
    <div class="auth-reset-brand"><i class="bi bi-envelope-check"></i></div>
    <h1>Verify your code</h1>
    <p>Enter the 6-digit code sent to <strong>{{ email }}</strong>. The code expires in 10 minutes.</p>

    <form class="auth-reset-form" (ngSubmit)="submit()">
      <div>
        <label for="verification-code">Verification code</label>
        <input
          id="verification-code"
          class="auth-reset-input"
          type="text"
          name="code"
          [(ngModel)]="code"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          placeholder="000000"
          required
        >
        <small class="auth-reset-help">The code can only be used once.</small>
      </div>

      <button class="auth-reset-button" type="submit" [disabled]="loading" [attr.aria-busy]="loading">
        <i class="bi" [class.bi-hourglass-split]="loading" [class.bi-check2-circle]="!loading"></i>
        {{ loading ? 'Verifying...' : 'Verify code' }}
      </button>
    </form>

    <div class="auth-reset-actions">
      <button class="auth-reset-resend" type="button" (click)="resendCode()" [disabled]="resending">
        {{ resending ? 'Sending...' : 'Resend code' }}
      </button>
      <a class="auth-reset-link" routerLink="/forgot-password">Change email</a>
    </div>
  </section>
</main>
