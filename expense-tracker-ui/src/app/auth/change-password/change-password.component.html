<section class="account-page">
  <div class="page-header">
    <div>
      <div class="eyebrow">ACCOUNT SECURITY</div>
      <h1>Change Password</h1>
      <p>Keep your Expense Tracker account secure.</p>
    </div>
  </div>

  <div class="password-card">
    <form (ngSubmit)="changePassword()" #passwordForm="ngForm">
      <div class="form-group">
        <label for="currentPassword">Current password</label>
        <div class="input-wrapper">
          <i class="bi bi-lock"></i>
          <input
            id="currentPassword"
            [type]="showCurrentPassword ? 'text' : 'password'"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            required
          >
          <button type="button" class="password-toggle" (click)="showCurrentPassword = !showCurrentPassword" aria-label="Show or hide current password">
            <i [class]="showCurrentPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">New password</label>
        <div class="input-wrapper">
          <i class="bi bi-shield-lock"></i>
          <input
            id="newPassword"
            [type]="showNewPassword ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            minlength="8"
            required
          >
          <button type="button" class="password-toggle" (click)="showNewPassword = !showNewPassword" aria-label="Show or hide new password">
            <i [class]="showNewPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
        <small>Use at least 8 characters.</small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <div class="input-wrapper">
          <i class="bi bi-shield-check"></i>
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
          >
          <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword" aria-label="Show or hide password confirmation">
            <i [class]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="save-button" [disabled]="loading || passwordForm.invalid">
        <i [class]="loading ? 'bi bi-hourglass-split' : 'bi bi-check2-circle'"></i>
        {{ loading ? 'Updating...' : 'Update password' }}
      </button>
    </form>
  </div>
</section>
