<main class="auth-reset-page">
  <section class="auth-reset-card">
    <div class="auth-reset-brand"><i class="bi bi-shield-lock"></i></div>
    <h1>Forgot password?</h1>
    <p>Enter the email linked to your account and we will send you a verification code.</p>

    <form class="auth-reset-form" (ngSubmit)="submit()">
      <div>
        <label for="reset-email">Email address</label>
        <input
          id="reset-email"
          class="auth-reset-input"
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <button class="auth-reset-button" type="submit" [disabled]="loading" [attr.aria-busy]="loading">
        <i class="bi" [class.bi-hourglass-split]="loading" [class.bi-send]="!loading"></i>
        {{ loading ? 'Sending...' : 'Send verification code' }}
      </button>
    </form>

    <a class="auth-reset-link" routerLink="/login">Back to Login</a>
  </section>
</main>
